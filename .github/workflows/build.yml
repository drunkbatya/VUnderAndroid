name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE=$(mktemp --suffix=.keystore -p "$GITHUB_WORKSPACE")
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "file=$KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Set name
        id: name
        run: |
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          docker build -t test \
              --secret "id=keystore,type=file,src=${{ steps.keystore.outputs.file }}" \
              --secret "id=keystorepass,env=KEYSTORE_PASSWORD" \
              --output type=local,dest=./build .
          cp build/app-release.apk "build/{{ steps.name.outputs.version }}.apk"

      - name: Collect release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --pretty='- %s' ${previous:+"$previous..HEAD"} > build/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.name.outputs.version }}" \
            "build/VUnder-${{ steps.name.outputs.version }}.apk" \
            --title "${{ steps.name.outputs.version }}" \
            --notes-file build/notes.md

      - name: Remove keystore
        if: always()
        run: |
          test -z "${{ steps.keystore.outputs.file }}" || rm -f "${{ steps.keystore.outputs.file }}"
